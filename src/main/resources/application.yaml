spring:
  application:
    name: todo-api
  datasource:
    url: jdbc:mysql://localhost:3306/todo_api?createDatabaseIfNotExist=true
    username: root
    password: MyPassword!
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration